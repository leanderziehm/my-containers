name: Publish containers to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'projects/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover projects
        id: find
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          import os

          projects = sorted(
              str(d.parent)
              for d in Path("projects").rglob("Dockerfile")
          )

          print("Discovered projects:")
          for project in projects:
              print(f" - {project}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"projects={json.dumps(projects)}\n")
          PY

  publish:
    needs: discover
    if: ${{ needs.discover.outputs.projects != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          PROJECT=$(basename "${{ matrix.project }}")

          echo "name=ghcr.io/${OWNER}/${PROJECT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
