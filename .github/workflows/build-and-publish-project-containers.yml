
name: Publish containers to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}

    steps:
      - uses: actions/checkout@v4

      - name: Discover projects
        id: find
        run: |
          projects=$(find projects -mindepth 2 -maxdepth 2 \
            -name Dockerfile -printf '%h\n' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          PROJECT=$(basename "${{ matrix.project }}")

          echo "name=ghcr.io/${OWNER}/${PROJECT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
