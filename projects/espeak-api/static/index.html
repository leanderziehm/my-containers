
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSpeak Text to Speech</title>

    <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 64vw;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    h1 {
        margin-top: 0;
        font-size: 26px;
        color: #111111;
    }

    .subtitle {
        color: #666666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: bold;
        color: #222222;
    }

    textarea,
    select,
    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        background: #ffffff;
        color: #111111;
        font-size: 15px;
        outline: none;
    }

    textarea:focus,
    select:focus,
    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    textarea {
        min-height: 40vh;
        resize: vertical;
    }

    .settings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 22px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        margin-top: 15px;
        color: #555555;
        font-size: 14px;
        min-height: 20px;
    }

    audio {
        width: 100%;
        margin-top: 20px;
    }

    .download {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #16a34a;
        color: #ffffff;
        text-decoration: none;
        text-align: center;
    }

    .download:hover {
        background: #15803d;
    }

    @media (max-width: 500px) {
        .container {
            padding: 20px;
        }

        .settings {
            grid-template-columns: 1fr;
        }
    }

    </style>
</head>

<body>

<div class="container">
    <h1>Text to Speech</h1>
    <p class="subtitle">Convert your text into speech using eSpeak NG.</p>

    <form id="ttsForm">

        <label for="text">Text to speak</label>
        <textarea
            id="text"
            maxlength="5000"
            placeholder="Enter something you want to hear..."
            required
        >Hello! Welcome to the eSpeak text to speech application.</textarea>

        <div class="settings">


            <div class="voice-selector">

                <label for="language">Language</label>
                <select id="language">
                    <option value="">Loading languages...</option>
                </select>

                <label for="voice">Voice</label>
                <select id="voice" disabled>
                    <option value="">Select a language first</option>
                </select>

            </div>


            <div>
                <label for="speed">Speed</label>
                <input
                    type="number"
                    id="speed"
                    value="150"
                    min="80"
                    max="450"
                >
            </div>

            <div>
                <label for="pitch">Pitch</label>
                <input
                    type="number"
                    id="pitch"
                    value="50"
                    min="0"
                    max="99"
                >
            </div>

        </div>

        <button type="submit" id="generateBtn">
            Generate Speech
        </button>

    </form>

    <div class="status" id="status"></div>

    <audio id="audio" controls hidden></audio>

    <a id="download" class="download" download="speech.wav">
        Download WAV
    </a>
</div>

<script>
    const API = "";
    const form = document.getElementById("ttsForm");
    const button = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const audio = document.getElementById("audio");
    const download = document.getElementById("download");
    const languageSelect = document.getElementById("language");
    const voiceSelect = document.getElementById("voice");

    let audioUrl = null;

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = document.getElementById("text").value.trim();
        const speed = Number(document.getElementById("speed").value);
        const pitch = Number(document.getElementById("pitch").value);
        // const voice = document.getElementById("voice").value;

        const voice = voiceSelect.value;

        if (!voice) {
            alert("Please select a voice");
            return;
        }
        
        if (!text) {
            status.textContent = "Please enter some text.";
            return;
        }

        if (speed < 80 || speed > 450 || pitch < 0 || pitch > 99) {
            status.textContent = "Invalid speed or pitch.";
            return;
        }

        button.disabled = true;
        button.textContent = "Generating...";
        status.textContent = "Generating speech, please wait...";

        audio.hidden = true;
        download.style.display = "none";

        if (audioUrl) {
            URL.revokeObjectURL(audioUrl);
            audioUrl = null;
        }

        try {
            const response = await fetch("/tts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "audio/wav"
                },
                body: JSON.stringify({
                    text,
                    voice,
                    speed,
                    pitch
                })
            });

            if (!response.ok) {
                throw new Error(
                    `Server error: ${response.status} ${await response.text()}`
                );
            }

            const blob = await response.blob();

            audioUrl = URL.createObjectURL(blob);

            audio.src = audioUrl;
            audio.hidden = false;

            download.href = audioUrl;
            download.style.display = "block";

            status.textContent = "Speech generated successfully!";

            await audio.play();

        } catch (error) {
            console.error(error);
            status.textContent = "Error: " + error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Generate Speech";
        }
    });




// Load all languages
async function loadLanguages() {
    try {
        const response = await fetch(`${API}/voices/languages`);
        if (!response.ok) throw new Error("Failed to load languages");

        const data = await response.json();

        // Remove special categories like "variant"
        data.languages = data.languages.filter(
            language => language.code !== "variant"
        );

        // Sort by voice count (highest first)
        data.languages.sort((a, b) => b.voice_count - a.voice_count);

        languageSelect.innerHTML =
            '<option value="">Select language</option>';

        data.languages.forEach(language => {
            const option = document.createElement("option");

            option.value = language.code;
            option.textContent =
                `${language.name} (${language.voice_count})`;

            languageSelect.appendChild(option);
        });

        // Auto-select first language and load its voices
        if (data.languages.length > 0) {
            languageSelect.selectedIndex = 1;
            loadVoices(languageSelect.value);
        }

    } catch (error) {
        console.error(error);
        languageSelect.innerHTML =
            '<option value="">Could not load languages</option>';
    }
}

// Load voices when language changes
async function loadVoices(language) {
    voiceSelect.disabled = true;
    voiceSelect.innerHTML =
        '<option value="">Loading voices...</option>';

    if (!language) {
        voiceSelect.innerHTML =
            '<option value="">Select a language first</option>';
        return;
    }

    try {
        const response = await fetch(
            `${API}/voices?variant=${encodeURIComponent(language)}`
        );

        if (!response.ok) throw new Error("Failed to load voices");

        const data = await response.json();

        voiceSelect.innerHTML =
            '<option value="">Select voice</option>';

        data.voices.forEach(voice => {
            const option = document.createElement("option");

            option.value = voice.language;
            option.textContent =
                `${voice.name.replaceAll("_", " ")} [${voice.language}]`;

            voiceSelect.appendChild(option);
        });

        if (data.voices.length > 0) {
            voiceSelect.selectedIndex = 1;
            voiceSelect.disabled = false;
        }

    } catch (error) {
        console.error(error);
        voiceSelect.innerHTML =
            '<option value="">Could not load voices</option>';
    }
}
// Listen for language selection
languageSelect.addEventListener("change", event => {
    loadVoices(event.target.value);
});

// Initialize
loadLanguages();

</script>

</body>
</html>
