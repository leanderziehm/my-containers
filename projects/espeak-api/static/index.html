
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSpeak Text to Speech</title>

    <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 64vw;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    h1 {
        margin-top: 0;
        font-size: 26px;
        color: #111111;
    }

    .subtitle {
        color: #666666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: bold;
        color: #222222;
    }

    textarea,
    select,
    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        background: #ffffff;
        color: #111111;
        font-size: 15px;
        outline: none;
    }

    textarea:focus,
    select:focus,
    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    textarea {
        min-height: 40vh;
        resize: vertical;
    }

    .settings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 22px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        margin-top: 15px;
        color: #555555;
        font-size: 14px;
        min-height: 20px;
    }

    audio {
        width: 100%;
        margin-top: 20px;
    }

    .download {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #16a34a;
        color: #ffffff;
        text-decoration: none;
        text-align: center;
    }

    .download:hover {
        background: #15803d;
    }

    @media (max-width: 500px) {
        .container {
            padding: 20px;
        }

        .settings {
            grid-template-columns: 1fr;
        }
    }

    </style>
</head>

<body>

<div class="container">
    <h1>Text to Speech</h1>
    <p class="subtitle">Convert your text into speech using eSpeak NG.</p>

    <form id="ttsForm">

        <label for="text">Text to speak</label>
        <textarea
            id="text"
            maxlength="5000"
            placeholder="Enter something you want to hear..."
            required
        >Hello! Welcome to the eSpeak text to speech application.</textarea>

        <div class="settings">

            <div>
                <label for="voice">Voice</label>
                <select id="voice">
                    <option value="en-us">English (US)</option>
                    <option value="en-gb">English (UK)</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <!-- <option value="fr">French</option> -->
                    <!-- <option value="it">Italian</option> -->
                </select>
            </div>

            <div>
                <label for="speed">Speed</label>
                <input
                    type="number"
                    id="speed"
                    value="150"
                    min="80"
                    max="450"
                >
            </div>

            <div>
                <label for="pitch">Pitch</label>
                <input
                    type="number"
                    id="pitch"
                    value="50"
                    min="0"
                    max="99"
                >
            </div>

        </div>

        <button type="submit" id="generateBtn">
            Generate Speech
        </button>

    </form>

    <div class="status" id="status"></div>

    <audio id="audio" controls hidden></audio>

    <a id="download" class="download" download="speech.wav">
        Download WAV
    </a>
</div>

<script>
    const form = document.getElementById("ttsForm");
    const button = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const audio = document.getElementById("audio");
    const download = document.getElementById("download");

    let audioUrl = null;

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = document.getElementById("text").value.trim();
        const voice = document.getElementById("voice").value;
        const speed = Number(document.getElementById("speed").value);
        const pitch = Number(document.getElementById("pitch").value);

        if (!text) {
            status.textContent = "Please enter some text.";
            return;
        }

        if (speed < 80 || speed > 450 || pitch < 0 || pitch > 99) {
            status.textContent = "Invalid speed or pitch.";
            return;
        }

        button.disabled = true;
        button.textContent = "Generating...";
        status.textContent = "Generating speech, please wait...";

        audio.hidden = true;
        download.style.display = "none";

        if (audioUrl) {
            URL.revokeObjectURL(audioUrl);
            audioUrl = null;
        }

        try {
            const response = await fetch("/tts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "audio/wav"
                },
                body: JSON.stringify({
                    text,
                    voice,
                    speed,
                    pitch
                })
            });

            if (!response.ok) {
                throw new Error(
                    `Server error: ${response.status} ${await response.text()}`
                );
            }

            const blob = await response.blob();

            audioUrl = URL.createObjectURL(blob);

            audio.src = audioUrl;
            audio.hidden = false;

            download.href = audioUrl;
            download.style.display = "block";

            status.textContent = "Speech generated successfully!";

            await audio.play();

        } catch (error) {
            console.error(error);
            status.textContent = "Error: " + error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Generate Speech";
        }
    });
</script>

</body>
</html>
