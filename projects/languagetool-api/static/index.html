
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanguageTool Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 64vw;
            margin: 40px auto;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 50vh;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        select, button {
            padding: 10px 14px;
            margin: 10px 5px 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .error {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ef4444;
        }

        .suggestion {
            background: #e0f2fe;
            border: none;
            color: #0369a1;
            cursor: pointer;
            margin: 5px 5px 0 0;
        }

        #status {
            margin: 12px 0;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>LanguageTool Grammar Checker</h1>

    <label for="language">Language:</label>

    <select id="language">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="de-DE">German</option>
    </select>

    <textarea
        id="text"
        placeholder="Enter your text here..."
    >This are a example sentence.</textarea>

    <br>

    <button id="checkButton" onclick="checkText()">
        Check text
    </button>

    <div id="status"></div>

    <h2>Suggestions</h2>

    <div id="results"></div>

<script>
    // const API_URL = "http://127.0.0.1:8010/v2/check";
    const API_URL = "/api/v2/check";

    let matches = [];

    async function checkText() {
        const text = document.getElementById("text").value;
        const language = document.getElementById("language").value;
        const button = document.getElementById("checkButton");
        const status = document.getElementById("status");
        const results = document.getElementById("results");

        if (!text.trim()) {
            status.textContent = "Please enter some text.";
            return;
        }

        button.disabled = true;
        status.textContent = "Checking...";
        results.innerHTML = "";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    text: text,
                    language: language
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            matches = data.matches || [];

            status.textContent =
                `${matches.length} issue(s) found.`;

            renderResults();

        } catch (error) {
            status.textContent =
                "Error connecting to LanguageTool: " + error.message;
        } finally {
            button.disabled = false;
        }
    }

    function renderResults() {
        const results = document.getElementById("results");
        results.innerHTML = "";

        if (matches.length === 0) {
            results.textContent = "No errors found!";
            return;
        }

        matches.forEach((match, index) => {
            const div = document.createElement("div");
            div.className = "error";

            const message = document.createElement("p");
            message.textContent = match.message;

            const original = document.createElement("strong");
            original.textContent =
                document.getElementById("text").value.substring(
                    match.offset,
                    match.offset + match.length
                );

            div.appendChild(message);
            div.appendChild(original);

            if (match.replacements?.length) {
                const label = document.createElement("p");
                label.textContent = "Suggestions:";
                div.appendChild(label);

                match.replacements.slice(0, 5).forEach(replacement => {
                    const button = document.createElement("button");
                    button.className = "suggestion";
                    button.textContent = replacement.value;

                    button.onclick = () => applySuggestion(index, replacement.value);

                    div.appendChild(button);
                });
            }

            results.appendChild(div);
        });
    }

    function applySuggestion(index, replacement) {
        const textarea = document.getElementById("text");
        const match = matches[index];

        textarea.value =
            textarea.value.substring(0, match.offset) +
            replacement +
            textarea.value.substring(match.offset + match.length);

        // Recheck because the original offsets are now outdated.
        checkText();
    }
</script>

</body>
</html>
