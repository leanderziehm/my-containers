services:
  languagetool:
    build: .
    container_name: custom-languagetool
    expose:
      - "8010"
    restart: unless-stopped

  frontend:
    image: docker.io/library/nginx:alpine
    container_name: languagetool-frontend
    ports:
      - "8081:80"
    volumes:
      - ./static/index.html:/usr/share/nginx/html/index.html:ro,Z
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - languagetool
    restart: unless-stopped